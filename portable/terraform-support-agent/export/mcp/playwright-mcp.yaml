# Playwright MCP Server configuration stub
# Phase: 4 (not active in Phases 1–3)
# Status: Design placeholder — do not activate until Phase 4 review is complete
#
# Used by: screen-capture skill (export/skills/screen-capture.md)
# See: docs/design/05-runtime-and-integration.md §3 for integration design
#
# PURPOSE: Read-only DOM text extraction from a customer's shared browser tab
# during a live troubleshooting call. All captured content passes through the
# screen-capture skill's redaction gate before entering a case packet.
#
# CRITICAL: This MCP server only reads visible text. It does NOT navigate,
# click, submit forms, or save screenshots to disk.

server:
  name: playwright-mcp
  # url: <set from environment — never hardcode>
  enabled: false   # must be set to true manually after Phase 4 review

allowed_tools:
  # Read-only text extraction — these are the ONLY tools permitted
  - browser_snapshot     # accessibility tree / visible text nodes
  - browser_find         # search visible text on page

blocked_tools:
  # ALL interaction and write tools — blocked unconditionally
  # No navigation, no clicks, no form interaction, no disk writes, no JS execution
  - browser_navigate
  - browser_navigate_back
  - browser_click
  - browser_fill
  - browser_fill_form
  - browser_type
  - browser_press_key
  - browser_select_option
  - browser_take_screenshot   # no disk writes during live customer capture
  - browser_evaluate          # no JavaScript execution on customer page
  - browser_file_upload
  - browser_drag
  - browser_hover
  - browser_tabs              # no tab management
  - browser_wait_for
  - browser_handle_dialog
  - browser_emulate_media

security_constraints:
  # These constraints are design requirements — enforced by the screen-capture skill,
  # not by this config file. Verify each during Phase 4 setup.
  read_visible_text_only: true
  no_cookie_access: true
  no_localstorage_access: true
  no_network_intercept: true
  operator_initiated_only: true   # no background capture, no polling
  redaction_gate_required: true   # all content passes through screen-capture skill redaction
